# Full stack (EC2 / production): docker compose up -d --build   (migrate -> API, plus Redis)
#   MongoDB is EXTERNAL: the API and migrate use DATABASE_URL from .env (e.g. MongoDB Atlas).
#   DATABASE_URL must point at a replica set (Atlas clusters already are) - Prisma needs it for transactions.
#   The API is published on host port API_HOST_PORT (default 80). Set API_HOST_PORT=5000 for local use,
#   or API_HOST_PORT=127.0.0.1:5000 when nginx sits in front.
#
# Local dev infrastructure:  docker compose up -d mongo redis   (then `npm run dev` on the host)
#   `mongo` is in the "local-db" profile, so it only starts when named explicitly (as above) or with
#   --profile local-db. It is never started by a plain `docker compose up`.
#
# Security: Redis (and the local mongo) are published on 127.0.0.1 ONLY, never on the network.
# Required in .env: DATABASE_URL, JWT_ACCESS_SECRET, REDIS_PASSWORD, CLIENT_URL.
services:
  api:
    build: .
    container_name: shoplytics-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Set here so a development .env can never put the container in development mode
      # (dev mode returns password-reset tokens in API responses and stack traces on errors).
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your MongoDB connection string}
      # Redis runs in this compose network and is reached by service name, not 127.0.0.1.
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (32+ chars)}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL in .env to your frontend origin, e.g. https://app.example.com}
    ports:
      - "${API_HOST_PORT:-80}:5000"
    # The app gives in-flight requests 10s to finish on SIGTERM; give it a little more before SIGKILL.
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # One-off: syncs collections + indexes (unique constraints) to the database before the API starts.
  migrate:
    build:
      context: .
      target: migrate
    container_name: shoplytics-migrate
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}

  redis:
    image: redis:7-alpine
    container_name: shoplytics-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD} # lets the healthcheck's redis-cli authenticate
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # Local development only (profile "local-db"): MongoDB 7 as a single-node replica set.
  mongo:
    image: mongo:7
    container_name: shoplytics-mongo
    profiles: ["local-db"]
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: >
        echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" |
        mongosh --port 27017 --quiet
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

volumes:
  mongo-data:
  redis-data:
